<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muffin Button</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="muffinArea"></div>
<div id="buttonContainer" hidden>
    <button id="muffinButton">MUFFIN</button>
    <button id="cookieButton">COOKIE</button>
    <button id="senzuButton">SENZU</button>
    <button id="targetButton" aria-pressed="false">SET SENZU TARGET</button>
    <button id="resetTargetButton">RESET TARGET</button>
    <button id="hideControlsButton">HIDE</button>
</div>
    <div id="targetPicker" hidden>Click where the bean should arrive. Press Escape to cancel.</div>
    <div id="targetMarker" hidden aria-hidden="true"></div>
    <div id="targetSettings" hidden>
        <label for="targetUrl">Target saved. Use this URL in OBS:</label>
        <input id="targetUrl" readonly aria-label="Overlay URL with senzu target">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
